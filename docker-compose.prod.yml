services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境不暴露端口到公网
    # ports: []

  backend:
    image: ${REGISTRY}/task-app-backend:${IMAGE_TAG}
    build:
      context: ./backend
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      # 對外 issuer（與 token 中 iss 宣告一致）
      KEYCLOAK_ISSUER_URI: http://localhost:9080/realms/taskapp
      # Keycloak 由獨立 compose 提供，跨 project 無法用服務名解析，
      # 故經宿主機映射埠 9080 抓取 JWK
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:9080/realms/taskapp/protocol/openid-connect/certs
      KEYCLOAK_PUBLIC_URL: http://localhost:9080
    extra_hosts:
      # Linux 原生 Docker 需此映射；Docker Desktop 已內建，保留亦無害
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    image: ${REGISTRY}/task-app-frontend:${IMAGE_TAG}
    build:
      context: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
