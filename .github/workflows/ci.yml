name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      - name: Dependency Audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true  # 先警告，后续可改为失败

      - name: Build
        working-directory: frontend
        run: npm run build

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: backend
        run: mvn test

      #- name: OWASP Dependency Check
      #  working-directory: backend
      #  run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      #  continue-on-error: true

      - name: Package
        working-directory: backend
        run: mvn package -DskipTests

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/java-spring
            p/javascript

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: backend:ci-${{ github.sha }}
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: frontend:ci-${{ github.sha }}
          load: true

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:ci-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # 先不失败，观察阶段

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:ci-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
